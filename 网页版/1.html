<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>视频搜索 · VideoHub Web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #e8ecf1 0%, #f2f4f7 45%, #eef1f5 100%);
    display: flex; justify-content: center; align-items: center; padding: 18px;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .glass {
    background: rgba(255,255,255,0.68);
    backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-radius: 26px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.07), 0 4px 14px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.55);
    width: 100%; max-width: 1120px; height: 100%; max-height: 860px;
    padding: 22px 30px 18px; display: flex; flex-direction: column; overflow: hidden;
    transition: box-shadow .2s;
  }
  body.dragging .glass { box-shadow: 0 0 0 3px rgba(0,122,255,.45), 0 18px 50px rgba(0,0,0,.1); }

  .header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; color: #1d1d1f; }
  .header .version { font-size: 12.5px; color: #8e8e93; font-weight: 500; letter-spacing: 0.15px; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; flex-shrink: 0; margin-bottom: 12px; }
  .toolbar input, .toolbar button {
    font-family: inherit; font-size: 14px; border: none; outline: none; border-radius: 11px; padding: 8px 15px;
    background: rgba(255,255,255,0.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    transition: transform .18s cubic-bezier(.25,.1,.25,1), background .18s cubic-bezier(.25,.1,.25,1),
                box-shadow .18s cubic-bezier(.25,.1,.25,1), border-color .18s cubic-bezier(.25,.1,.25,1);
  }
  .toolbar input { flex: 1 1 170px; min-width: 120px; border: 1px solid rgba(0,0,0,0.04); color: #1d1d1f; }
  .toolbar input::placeholder { color: #8e8e93; }
  .toolbar input:focus { background: rgba(255,255,255,0.96); border-color: #007aff; box-shadow: 0 0 0 3.5px rgba(0,122,255,0.15); }
  .toolbar button {
    background: #007aff; color: #fff; font-weight: 520; padding: 8px 16px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,122,255,0.22); border: 1px solid rgba(255,255,255,0.2); letter-spacing: 0.1px;
  }
  .toolbar button:hover { background: #0071e3; transform: translateY(-0.5px); box-shadow: 0 4px 14px rgba(0,122,255,0.28); }
  .toolbar button:active { transform: scale(0.97); box-shadow: 0 1px 6px rgba(0,122,255,0.2); }
  .toolbar button.secondary { background: rgba(255,255,255,0.72); color: #1d1d1f; box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
  .toolbar button.secondary:hover { background: rgba(255,255,255,0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

  .switch-group { display: flex; gap: 18px; align-items: center; margin-left: auto; font-size: 13px; color: #1d1d1f; }
  .switch-group label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .switch-group .switch-label { font-size: 13px; font-weight: 450; letter-spacing: -0.1px; }
  .switch-group input[type="checkbox"] { display: none; }
  .switch-group .toggle {
    position: relative; width: 42px; height: 25px; flex-shrink: 0; background: #e5e5ea; border-radius: 12.5px;
    transition: background .28s cubic-bezier(.25,.1,.25,1); box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
  }
  .switch-group .toggle.active { background: #34c759; }
  .switch-group .toggle .knob {
    position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; background: #fff; border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.16), 0 1px 1px rgba(0,0,0,0.08);
    transition: transform .28s cubic-bezier(.34,1.45,.64,1);
  }
  .switch-group .toggle.active .knob { transform: translateX(17px); }

  .list-container { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; margin-top: 2px; justify-content: flex-start; }
  .file-item {
    background: rgba(255,255,255,0.58); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 13px; padding: 8px 15px; border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 1px 6px rgba(0,0,0,0.02); flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center;
    transition: transform .2s cubic-bezier(.25,.1,.25,1), background .2s cubic-bezier(.25,.1,.25,1), box-shadow .2s cubic-bezier(.25,.1,.25,1);
    will-change: transform; animation: fadeIn .22s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .file-item:hover { background: rgba(255,255,255,0.82); box-shadow: 0 4px 14px rgba(0,0,0,0.045); transform: translateY(-1px); }
  .file-item .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; }
  .file-item .top .name { font-size: 14.5px; font-weight: 520; color: #1d1d1f; word-break: break-word; letter-spacing: -0.2px; }
  .file-item .top .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .file-item .top .actions button {
    padding: 4px 12px; font-size: 12px; border-radius: 16px; border: none; background: #007aff; color: #fff;
    cursor: pointer; font-weight: 510; letter-spacing: .05px; font-family: inherit;
    transition: transform .16s cubic-bezier(.25,.1,.25,1), background .16s cubic-bezier(.25,.1,.25,1);
  }
  .file-item .top .actions button:hover { background: #0071e3; transform: scale(1.03); }
  .file-item .top .actions button:active { transform: scale(.97); }
  .file-item .top .actions button.web { background: #34c759; }
  .file-item .top .actions button.web:hover { background: #30b753; }
  .file-item .meta { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 7px 14px; font-size: 11.5px; color: #6e6e73; letter-spacing: -0.1px; }
  .file-item .meta .title { color: #1d1d1f; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }

  .empty { text-align: center; color: #8e8e93; font-size: 15.5px; font-weight: 450; margin: auto; }
  .empty.scanning { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
  .empty.scanning .hint { margin-top: 11px; color: #8e8e93; font-size: 14.5px; font-weight: 450; }
  .spinner { width: 36px; height: 36px; border: 2.8px solid rgba(0,0,0,.07); border-top-color: #007aff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pagination-wrapper {
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(0,0,0,0.045); flex-wrap: wrap; gap: 8px; min-height: 48px;
  }
  .pagination-wrapper .left { font-size: 12.5px; color: #8e8e93; font-weight: 450; }
  .pagination-wrapper .center { flex: 1 1 auto; display: flex; justify-content: center; }
  .pagination-wrapper .right { font-size: 12px; color: #8e8e93; }
  .pagination-wrapper .right a { color: #007aff; text-decoration: none; font-weight: 500; }
  .pagination-wrapper .right a:hover { opacity: .75; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
  .pagination button {
    min-width: 38px; height: 34px; padding: 0 11px; border-radius: 9px; border: 1.5px solid #d1d1d6;
    background: #fff; color: #1d1d1f; font-size: 13.5px; font-weight: 500; font-family: inherit; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); display: inline-flex; align-items: center; justify-content: center;
    transition: transform .16s cubic-bezier(.25,.1,.25,1), background .16s, box-shadow .16s, border-color .16s;
  }
  .pagination button.nav { color: #007aff; font-size: 14.5px; padding: 0 10px; }
  .pagination button.active { border-color: #007aff; background: #007aff; color: #fff; font-weight: 600; box-shadow: 0 2px 7px rgba(0,122,255,.25); }
  .pagination button:disabled { opacity: .36; cursor: default; }
  .pagination button:hover:not(:disabled) { transform: translateY(-.5px); }
  .pagination button:active:not(:disabled) { transform: scale(.96); }
  .pagination .ellipsis { min-width: 26px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: #8e8e93; font-size: 13.5px; user-select: none; }

  .overlay {
    position: fixed; inset: 0; z-index: 50; padding: 24px; display: flex; align-items: center; justify-content: center;
    background: rgba(20,20,22,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .22s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .player-card {
    background: rgba(255,255,255,.84); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,.6); border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.3);
    width: min(1000px, 94vw); max-height: 94vh; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px;
    transform: scale(.97); transition: transform .22s cubic-bezier(.25,.1,.25,1);
  }
  .overlay.show .player-card { transform: scale(1); }
  .player-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .player-head .name { font-size: 14.5px; font-weight: 550; color: #1d1d1f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-head .btns { display: flex; gap: 8px; flex-shrink: 0; }
  .player-head button, .player-head a {
    font-family: inherit; font-size: 12.5px; font-weight: 510; text-decoration: none; cursor: pointer;
    padding: 6px 14px; border-radius: 15px; border: 1px solid rgba(0,0,0,.06);
    background: rgba(255,255,255,.85); color: #1d1d1f; transition: background .16s, transform .16s;
  }
  .player-head button:hover, .player-head a:hover { background: #fff; transform: translateY(-.5px); }
  .player-card video { width: 100%; max-height: 70vh; border-radius: 14px; background: #000; display: block; }
  .player-note { font-size: 12px; color: #8e8e93; }
  .player-note.error { color: #ff3b30; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 14px); z-index: 80;
    background: rgba(29,29,31,.92); color: #fff; font-size: 13.5px; padding: 9px 18px; border-radius: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 700px) {
    .glass { padding: 15px; border-radius: 20px; }
    .header h1 { font-size: 21px; }
    .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
    .switch-group { margin-left: 0; justify-content: flex-start; flex-wrap: wrap; gap: 12px; }
    .pagination-wrapper { flex-direction: column; align-items: center; gap: 7px; }
    .file-item .meta .title { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="glass" id="app">
  <div class="header">
    <h1>视频搜索</h1>
    <span class="version" id="versionLabel">版本 8.4.G · 纯前端</span>
  </div>

  <div class="toolbar">
    <button id="scanBtn">浏览</button>
    <input type="text" id="searchInput" placeholder="搜索视频" autocomplete="off" spellcheck="false" />
    <button class="secondary" id="exportBtn">导出链接</button>
    <div class="switch-group">
      <label>
        <span class="switch-label">包含子文件夹</span>
        <span class="toggle active" id="subfolderToggle"><span class="knob"></span></span>
        <input type="checkbox" id="subfolderSwitch" checked />
      </label>
      <label>
        <span class="switch-label">内嵌播放</span>
        <span class="toggle active" id="playToggle"><span class="knob"></span></span>
        <input type="checkbox" id="playSwitch" checked />
      </label>
    </div>
  </div>

  <div class="list-container" id="listContainer">
    <div class="empty">选择文件夹以开始</div>
  </div>

  <div class="pagination-wrapper">
    <span class="left">共 <span id="totalCount">0</span> 个项目</span>
    <div class="center"><div id="pagination" class="pagination"></div></div>
    <span class="right">由 <a href="//t.me/timharrys" target="_blank" rel="noopener">D1r3ctor</a> 设计</span>
  </div>
</div>

<input type="file" id="folderInput" webkitdirectory multiple hidden />

<div class="overlay" id="overlay">
  <div class="player-card" role="dialog" aria-modal="true">
    <div class="player-head">
      <span class="name" id="playerName"></span>
      <div class="btns">
        <a id="playerDownload" download>下载</a>
        <button id="playerClose">关闭</button>
      </div>
    </div>
    <video id="player" controls autoplay playsinline></video>
    <div class="player-note" id="playerNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const VIDEO_EXT = ['.mp4', '.mov', '.mkv', '.avi', '.flv', '.webm', '.wmv', '.mpg', '.mpeg'];
  const PER_PAGE = 7;
  const PARSE_WORKERS = 4;
  const PROBE_TIMEOUT = 12000;

  const $ = id => document.getElementById(id);
  const listContainer = $('listContainer');
  const paginationEl = $('pagination');
  const totalCountEl = $('totalCount');
  const searchInput = $('searchInput');
  const subSwitch = $('subfolderSwitch');
  const playSwitch = $('playSwitch');
  const folderInput = $('folderInput');
  const overlay = $('overlay');
  const player = $('player');
  const playerName = $('playerName');
  const playerNote = $('playerNote');
  const playerDownload = $('playerDownload');
  const versionLabel = $('versionLabel');

  const state = { items: [], view: [], page: 1, totalPages: 1, keyword: '', rootName: '' };
  let playerUrl = null;

  /* ---------- 工具 ---------- */
  const isVideo = name => VIDEO_EXT.some(ext => name.toLowerCase().endsWith(ext));

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function fmtSize(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + units[i];
  }

  function fmtDuration(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    const pad = n => String(n).padStart(2, '0');
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }

  function fmtTime(ms) {
    const d = new Date(ms);
    if (isNaN(d.getTime())) return '';
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function extractUrl(text) {
    if (!text) return '';
    const m = text.replace(/[\n\t]/g, ' ').match(/https?:\/\/\S+/);
    return m ? m[0] : '';
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function bindToggle(checkbox, toggle) {
    const sync = () => toggle.classList.toggle('active', checkbox.checked);
    sync();
    checkbox.addEventListener('change', sync);
  }
  bindToggle(subSwitch, $('subfolderToggle'));
  bindToggle(playSwitch, $('playToggle'));

  /* ---------- 元数据探测：用隐藏 <video> 代替 OpenCV ---------- */
  function probeFile(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const v = document.createElement('video');
      let settled = false;
      let timer = null;

      const finish = (w, h, d) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        v.removeAttribute('src');
        try { v.load(); } catch (e) { /* ignore */ }
        URL.revokeObjectURL(url);
        resolve({ w: w || 0, h: h || 0, d: d || 0 });
      };

      v.preload = 'metadata';
      v.muted = true;
      v.addEventListener('loadedmetadata', () => {
        const d = Number.isFinite(v.duration) ? v.duration : 0;
        finish(Math.round(v.videoWidth || 0), Math.round(v.videoHeight || 0), d);
      });
      v.addEventListener('error', () => finish(0, 0, 0));
      timer = setTimeout(() => finish(0, 0, 0), PROBE_TIMEOUT);
      v.src = url;
    });
  }

  function buildItem(desc, file, probe) {
    const rel = desc.rel;
    const slash = rel.lastIndexOf('/');
    return {
      name: desc.name,
      rel,
      folder: slash > 0 ? rel.slice(0, slash) : '',
      file,
      resolution: probe.w && probe.h ? probe.w + '×' + probe.h : '分辨率未知',
      duration: probe.d ? fmtDuration(probe.d) : '--:--:--',
      size: fmtSize(file.size),
      mtime: fmtTime(file.lastModified),
      jump: extractUrl(desc.name)
    };
  }

  /* ---------- 扫描 ---------- */
  function showScanning(total) {
    listContainer.innerHTML =
      '<div class="empty scanning"><div class="spinner"></div>' +
      '<div class="hint scan-text">正在解析 0/' + total + '</div></div>';
    const textEl = listContainer.querySelector('.scan-text');
    return text => { if (textEl) textEl.textContent = text; };
  }

  async function loadEntries(descs) {
    if (!descs.length) {
      state.items = [];
      applyFilter();
      toast('未找到视频文件');
      return;
    }

    const progress = showScanning(descs.length);
    const results = new Array(descs.length);
    let cursor = 0;
    let done = 0;

    const worker = async () => {
      while (true) {
        const idx = cursor++;
        if (idx >= descs.length) return;
        const desc = descs[idx];
        let file = null;
        try {
          file = await desc.getFile();
        } catch (e) {
          done++;
          continue;
        }
        const probe = await probeFile(file);
        results[idx] = buildItem(desc, file, probe);
        done++;
        progress('正在解析 ' + done + '/' + descs.length);
      }
    };

    await Promise.all(Array.from({ length: Math.min(PARSE_WORKERS, descs.length) }, worker));

    state.items = results.filter(Boolean).sort((a, b) =>
      a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' })
    );
    state.items.forEach((it, i) => { it.index = i; });
    state.page = 1;
    applyFilter();
  }

  /* ---------- 目录来源 1：File System Access API ---------- */
  async function chooseFolder() {
    if (!window.showDirectoryPicker) {
      folderInput.click();
      return;
    }
    let dir;
    try {
      dir = await window.showDirectoryPicker({ id: 'videohub', mode: 'read' });
    } catch (e) {
      return; // 用户取消
    }

    state.rootName = dir.name;
    const includeSub = subSwitch.checked;
    const descs = [];

    const walk = async (handle, rel) => {
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          if (isVideo(entry.name)) {
            descs.push({
              name: entry.name,
              rel: rel + entry.name,
              getFile: () => entry.getFile()
            });
          }
        } else if (entry.kind === 'directory' && includeSub) {
          await walk(entry, rel + entry.name + '/');
        }
      }
    };

    await walk(dir, '');
    versionLabel.textContent = '版本 8.4.G · ' + state.rootName;
    await loadEntries(descs);
  }

  /* ---------- 目录来源 2：<input webkitdirectory> 回退 ---------- */
  folderInput.addEventListener('change', () => {
    const files = Array.from(folderInput.files || []);
    if (!files.length) return;
    const includeSub = subSwitch.checked;
    const rels = files.map(f => f.webkitRelativePath || f.name);
    const rootName = rels[0] && rels[0].includes('/') ? rels[0].split('/')[0] : '已选文件';
    state.rootName = rootName;
    versionLabel.textContent = '版本 8.4.G · ' + rootName;

    const descs = [];
    files.forEach((file, i) => {
      if (!isVideo(file.name)) return;
      const full = rels[i];
      const rel = full.startsWith(rootName + '/') ? full.slice(rootName.length + 1) : full;
      if (!includeSub && rel.includes('/')) return;
      descs.push({ name: file.name, rel, getFile: async () => file });
    });

    folderInput.value = '';
    loadEntries(descs);
  });

  /* ---------- 目录来源 3：拖拽 ---------- */
  document.addEventListener('dragover', e => {
    e.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', e => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', async e => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const items = Array.from((e.dataTransfer && e.dataTransfer.items) || []);
    if (!items.length) return;

    const includeSub = subSwitch.checked;
    const descs = [];

    const descFromEntry = (entry, rel) => ({
      name: entry.name,
      rel: rel + entry.name,
      getFile: () => new Promise((res, rej) => entry.file(res, rej))
    });

    const readDir = async (dirEntry, rel) => {
      const reader = dirEntry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const entry of batch) {
          if (entry.isFile) {
            if (isVideo(entry.name)) descs.push(descFromEntry(entry, rel));
          } else if (entry.isDirectory && includeSub) {
            await readDir(entry, rel + entry.name + '/');
          }
        }
      } while (batch.length);
    };

    for (const item of items) {
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (!entry) {
        const f = item.getAsFile && item.getAsFile();
        if (f && isVideo(f.name)) descs.push({ name: f.name, rel: f.name, getFile: async () => f });
        continue;
      }
      if (entry.isFile) {
        if (isVideo(entry.name)) descs.push(descFromEntry(entry, ''));
      } else if (entry.isDirectory) {
        state.rootName = entry.name;
        versionLabel.textContent = '版本 8.4.G · ' + entry.name;
        await readDir(entry, '');
      }
    }

    await loadEntries(descs);
  });

  /* ---------- 过滤 / 渲染 ---------- */
  function applyFilter() {
    const kw = state.keyword.trim().toLowerCase();
    state.view = kw
      ? state.items.filter(it =>
          (it.name + ' ' + it.rel + ' ' + it.jump).toLowerCase().includes(kw))
      : state.items.slice();
    state.totalPages = Math.max(1, Math.ceil(state.view.length / PER_PAGE));
    if (state.page > state.totalPages) state.page = state.totalPages;
    renderPage();
  }

  function renderPage() {
    totalCountEl.textContent = state.view.length;
    const start = (state.page - 1) * PER_PAGE;
    renderItems(state.view.slice(start, start + PER_PAGE));
    renderPagination();
  }

  function cardHeight() {
    const gap = 6;
    const h = listContainer.clientHeight || 560;
    return Math.max(48, (h - gap * (PER_PAGE - 1)) / PER_PAGE);
  }

  function renderItems(items) {
    if (!items.length) {
      listContainer.innerHTML = '<div class="empty">' +
        (state.items.length ? '未找到视频' : '选择文件夹以开始') + '</div>';
      return;
    }

    const height = cardHeight();
    const frag = document.createDocumentFragment();

    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'file-item';
      el.style.height = height + 'px';
      el.dataset.index = String(item.index);

      const tail = item.folder || item.jump || '未命名';
      el.innerHTML =
        '<div class="top">' +
          '<span class="name" title="' + esc(item.rel) + '">' + esc(item.name) + '</span>' +
          '<div class="actions">' +
            '<button class="play-local">播放</button>' +
            '<button class="play-web web">在浏览器中打开</button>' +
          '</div>' +
        '</div>' +
        '<div class="meta">' +
          '<span>' + esc(item.resolution) + ' · ' + esc(item.duration) + ' · ' +
            esc(item.size) + ' · ' + esc(item.mtime) + '</span>' +
          '<span class="title">' + esc(tail) + '</span>' +
        '</div>';

      frag.appendChild(el);
    });

    listContainer.innerHTML = '';
    listContainer.appendChild(frag);
  }

  function renderPagination() {
    const total = state.totalPages;
    const cur = state.page;
    if (total <= 1) {
      paginationEl.innerHTML = '';
      return;
    }

    let html = '';
    html += '<button class="nav" data-page="1" ' + (cur === 1 ? 'disabled' : '') + '>«</button>';
    html += '<button class="nav" data-page="' + (cur - 1) + '" ' + (cur === 1 ? 'disabled' : '') + '>‹</button>';

    const pages = [];
    if (total <= 7) {
      for (let i = 1; i <= total; i++) pages.push(i);
    } else {
      pages.push(1);
      let start = Math.max(2, cur - 1);
      let end = Math.min(total - 1, cur + 1);
      if (cur <= 3) { start = 2; end = 4; }
      else if (cur >= total - 2) { start = total - 3; end = total - 1; }
      if (start > 2) pages.push('...');
      for (let i = start; i <= end; i++) pages.push(i);
      if (end < total - 1) pages.push('...');
      pages.push(total);
    }

    pages.forEach(p => {
      if (p === '...') {
        html += '<span class="ellipsis">…</span>';
      } else if (p === cur) {
        html += '<button class="active" data-page="' + p + '">' + p + '</button>';
      } else {
        html += '<button data-page="' + p + '">' + p + '</button>';
      }
    });

    html += '<button class="nav" data-page="' + (cur + 1) + '" ' + (cur === total ? 'disabled' : '') + '>›</button>';
    html += '<button class="nav" data-page="' + total + '" ' + (cur === total ? 'disabled' : '') + '>»</button>';

    paginationEl.innerHTML = html;
  }

  /* ---------- 播放 / 打开 ---------- */
  function closePlayer() {
    overlay.classList.remove('show');
    player.pause();
    player.removeAttribute('src');
    try { player.load(); } catch (e) { /* ignore */ }
    if (playerUrl) { URL.revokeObjectURL(playerUrl); playerUrl = null; }
    playerNote.textContent = '';
    playerNote.classList.remove('error');
  }

  function openPlayer(item) {
    if (!playSwitch.checked) {
      downloadFile(item);
      return;
    }
    closePlayer();
    playerUrl = URL.createObjectURL(item.file);
    playerName.textContent = item.name;
    playerName.title = item.rel;
    playerNote.textContent = item.resolution + ' · ' + item.duration + ' · ' + item.size;
    playerNote.classList.remove('error');
    playerDownload.href = playerUrl;
    playerDownload.download = item.name;
    player.src = playerUrl;
    overlay.classList.add('show');
    player.play().catch(() => { /* 自动播放可能被拦截，用户手动点即可 */ });
  }

  player.addEventListener('error', () => {
    if (!overlay.classList.contains('show')) return;
    playerNote.textContent = '浏览器无法解码此格式（常见于 MKV / AVI / HEVC），请点右上角「下载」后用本地播放器打开。';
    playerNote.classList.add('error');
  });

  function downloadFile(item) {
    const url = URL.createObjectURL(item.file);
    const a = document.createElement('a');
    a.href = url;
    a.download = item.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已开始下载：' + item.name);
  }

  function openExternal(item) {
    if (item.jump && /^https?:/i.test(item.jump)) {
      window.open(item.jump, '_blank', 'noopener');
    } else {
      const query = item.name.replace(/\.\w+$/, '');
      window.open('https://www.bing.com/search?q=' + encodeURIComponent(query), '_blank', 'noopener');
    }
  }

  /* ---------- 事件绑定 ---------- */
  document.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) {
      if (btn.dataset.page) {
        const page = parseInt(btn.dataset.page, 10);
        if (page && page !== state.page && page >= 1 && page <= state.totalPages) {
          state.page = page;
          renderPage();
        }
        return;
      }

      const card = btn.closest('.file-item');
      if (card) {
        const item = state.items[Number(card.dataset.index)];
        if (!item) return;
        if (btn.classList.contains('play-local')) { openPlayer(item); return; }
        if (btn.classList.contains('play-web')) { openExternal(item); return; }
      }
    }

    const nameEl = e.target.closest('.file-item .name');
    if (nameEl && e.detail === 2) {
      const card = nameEl.closest('.file-item');
      const item = state.items[Number(card.dataset.index)];
      if (item) {
        navigator.clipboard.writeText(item.rel)
          .then(() => toast('路径已复制'))
          .catch(() => toast(item.rel));
      }
    }
  });

  $('scanBtn').addEventListener('click', chooseFolder);
  $('exportBtn').addEventListener('click', () => {
    if (!state.items.length) { toast('请先选择文件夹'); return; }
    const text = state.items.map(it => it.name + '\t' + (it.jump || '无链接')).join('\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'log.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已导出 ' + state.items.length + ' 条到 log.txt');
  });

  $('playerClose').addEventListener('click', closePlayer);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });

  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.keyword = searchInput.value;
      state.page = 1;
      applyFilter();
    }, 200);
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.items.length && !listContainer.querySelector('.scanning')) renderPage();
    }, 160);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePlayer();
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  window.addEventListener('beforeunload', () => {
    if (playerUrl) URL.revokeObjectURL(playerUrl);
  });
})();
</script>
</body>
</html>
